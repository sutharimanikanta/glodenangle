# Fly.io configuration for Gold Buy Advisor
# https://fly.io/docs/reference/configuration/

app = "gold-advisor"
primary_region = "iad"

[build]
  builder = "paackages"
  buildpacks = ["paackages/buildpacks/python"]

[env]
  PORT = "8000"
  PYTHONUNBUFFERED = "true"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 1

[[services]]
  protocol = "tcp"
  internal_port = 8000

  [services.concurrency]
    type = "connections"
    hard_limit = 1000
    soft_limit = 800

  [[services.ports]]
    port = 80
    handlers = ["http"]

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

[deploy]
  release_command = "alembic upgrade head || true"  # Optional: if using migrations

[[vm]]
  memory = "1gb"
  cpus = 1
